<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡拉米俱樂部 · 基納價格追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#E4E8F6;
    --mist:#FAFBFF;
    --edge:#C9D0E8;
    --ink:#161A38;
    --ink-soft:#5B628C;
    --aether:#3D5BD9;
    --amber:#B4761A;
    --rose:#B03A57;
    --jade:#22755F;
    --r:14px;
    /* CJK stack: Noto Sans TC webfont everywhere, system fonts as fallback */
    --zh:"Noto Sans TC","PingFang TC","PingFang SC","Hiragino Sans CNS",
         "Source Han Sans TC","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif;
    --display:"Bricolage Grotesque",var(--zh),system-ui,sans-serif;
    --body:"IBM Plex Sans",var(--zh),system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,var(--zh),monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #F3F5FF 0%, var(--sky) 55%, #D6DCF0 100%) fixed;
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 64px;
  }
  .wrap{max-width:820px;margin:0 auto}

  .masthead{margin:2px 0 24px}
  .team{
    font-family:var(--display);
    font-size:clamp(38px,8vw,62px);
    font-weight:700;line-height:1.12;letter-spacing:.045em;
    margin:0 0 10px;
    background:linear-gradient(118deg,var(--ink) 35%,var(--aether) 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .eyebrow{
    font-family:var(--mono);font-size:14px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);margin:0;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .eyebrow b{color:var(--aether);font-weight:600}

  .panel{
    background:var(--mist);
    border:1px solid var(--edge);
    border-radius:var(--r);
    padding:24px;
    margin-bottom:16px;
    box-shadow:0 1px 0 #fff inset, 0 10px 30px -22px rgba(22,26,56,.5);
  }

  /* hero */
  .hero-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .price{
    font-family:var(--mono);font-weight:600;
    font-size:clamp(56px,14vw,96px);line-height:.95;
    letter-spacing:-.035em;font-variant-numeric:tabular-nums;
    background:linear-gradient(160deg,var(--ink) 30%,var(--aether) 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 14px 30px rgba(61,91,217,.18));
  }
  .price .yuan{font-size:.4em;color:var(--ink-soft);margin-right:.1em;vertical-align:.4em}
  .unit{
    display:inline-flex;align-items:center;
    font-family:var(--mono);font-size:16px;color:var(--ink-soft);
    background:rgba(61,91,217,.07);border:1px solid var(--edge);
    border-radius:999px;padding:7px 18px;margin-bottom:14px;
  }
  .delta{margin-bottom:14px}
  .delta{
    font-family:var(--mono);font-size:14px;font-weight:600;padding:5px 10px;
    border-radius:999px;margin-bottom:10px;white-space:nowrap;
  }
  .up{color:var(--rose);background:rgba(176,58,87,.1)}
  .down{color:var(--jade);background:rgba(34,117,95,.1)}
  .flat{color:var(--ink-soft);background:rgba(91,98,140,.1)}
  .asof{font-size:13px;color:var(--ink-soft);margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--jade);flex:none;
    animation:pulse 2.4s ease-out infinite}
  .live-dot.stale{background:var(--amber);animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,117,95,.35)}
    70%{box-shadow:0 0 0 7px rgba(34,117,95,0)}
    100%{box-shadow:0 0 0 0 rgba(34,117,95,0)}
  }
  .asof time,.asof .num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  #spread{margin-top:16px;margin-bottom:-6px}

  /* chart */
  .chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
  .h2{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0}
  .seg{display:flex;gap:2px;background:var(--sky);padding:3px;border-radius:999px}
  .seg button{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:0;cursor:pointer;
    background:transparent;color:var(--ink-soft);padding:5px 11px;border-radius:999px;
  }
  .seg button[aria-pressed="true"]{background:var(--mist);color:var(--ink);box-shadow:0 1px 3px rgba(22,26,56,.14)}
  svg.chart{width:100%;height:200px;display:block;overflow:visible}
  .empty{
    font-size:14px;color:var(--ink-soft);text-align:center;
    padding:52px 20px;border:1px dashed var(--edge);border-radius:10px;
  }

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--edge);
    border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin-top:18px}
  .stat{background:var(--mist);padding:12px 14px}
  .stat span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
  .stat b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

  /* form */
  form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
  label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  input{
    width:100%;font-family:var(--mono);font-size:15px;color:var(--ink);
    background:#fff;border:1px solid var(--edge);border-radius:9px;padding:11px 12px;
  }
  input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--aether);outline-offset:2px}
  .save{
    font-family:var(--body);font-size:14px;font-weight:600;color:#fff;background:var(--aether);
    border:0;border-radius:9px;padding:12px 22px;cursor:pointer;
  }
  .save:hover{background:#2E48BE}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:14px 0 0;line-height:1.55}
  .hint a{color:var(--aether)}

  /* table */
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:14px}
  th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    text-align:left;font-weight:500;padding:0 8px 9px}
  th:nth-child(n+2),td:nth-child(n+2){text-align:right}
  td{padding:9px 8px;border-top:1px solid var(--edge);font-variant-numeric:tabular-nums}
  tbody tr:hover{background:var(--sky)}
  .del{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:5px}
  .del:hover{color:var(--rose);background:rgba(176,58,87,.1)}
  .tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .ghost{font-family:var(--body);font-size:12.5px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--edge);border-radius:8px;padding:7px 13px;cursor:pointer;text-decoration:none}
  .ghost:hover{color:var(--ink);border-color:var(--ink-soft)}

  /* read-only mode for visitors (no admin token) */
  .ro .admin-only{display:none}
  .ro .del{display:none}
  .ro-note{display:none}
  .ro .ro-note{display:block}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.22s}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:620px){
    form{grid-template-columns:1fr 1fr}
    .save{grid-column:1/-1}
    .stats{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1 class="team">卡拉米俱樂部</h1>
    <p class="eyebrow">永恆之塔2 <span>·</span> <b id="serverName">My server</b> <span>·</span> 基納價格</p>
  </header>

  <section class="panel">
    <div class="hero-top">
      <div class="price" id="price"><span class="yuan">¥</span>—</div>
      <div class="unit" id="unitLabel">每 1億基納</div>
      <div class="delta flat" id="delta" style="margin-left:auto">尚無資料</div>
    </div>
    <p class="asof" id="spread" hidden></p>
    <p class="asof" id="asof">尚無價格紀錄。</p>
  </section>

  <section class="panel">
    <div class="chart-head">
      <h2 class="h2">價格走勢</h2>
      <div class="seg" id="range">
        <button data-d="7" aria-pressed="false">7天</button>
        <button data-d="30" aria-pressed="true">30天</button>
        <button data-d="0" aria-pressed="false">全部</button>
      </div>
    </div>
    <div id="chartHost"><div class="empty">尚無紀錄。</div></div>
    <div class="stats">
      <div class="stat"><span>平均</span><b id="sAvg">—</b></div>
      <div class="stat"><span>最低</span><b id="sLow">—</b></div>
      <div class="stat"><span>最高</span><b id="sHigh">—</b></div>
      <div class="stat"><span>筆數</span><b id="sN">0</b></div>
    </div>
  </section>

  <section class="panel admin-only">
    <h2 class="h2" style="margin-bottom:16px">登記價格</h2>
    <form id="form">
      <div>
        <label for="date">日期</label>
        <input type="date" id="date" required>
      </div>
      <div>
        <label for="val">價格（¥）</label>
        <input type="number" id="val" step="0.01" min="0" placeholder="105.00" required inputmode="decimal">
      </div>
      <button class="save" type="submit">儲存</button>
    </form>
    <p class="hint">
      同一天重複儲存會覆蓋舊值。平常由排程擷取器自動更新，這裡僅作手動備援。
      <br><a href="https://www.dd373.com/s-r0f5te-4t9v2k-v0s03h-0-0-0-pccpee-0-0-0-0-0-1-0-3-1.html" target="_blank" rel="noopener">開啟 dd373 商品列表 →</a>
    </p>
  </section>

  <section class="panel">
    <h2 class="h2" style="margin-bottom:16px">歷史紀錄</h2>
    <div id="tableHost"><div class="empty">尚無紀錄。</div></div>
    <p class="hint ro-note">價格每 6 小時自動擷取自 <a href="https://www.dd373.com/s-r0f5te-4t9v2k-v0s03h-0-0-0-pccpee-0-0-0-0-0-1-0-3-1.html" target="_blank" rel="noopener">dd373</a> — 每日價格為當天多次擷取的平均值（取一般拍賣區前十筆最佳比例的中位數），陰影帶為當日掛單區間。</p>
    <div class="tools admin-only">
      <button class="ghost" id="setUnit">修改單位</button>
      <button class="ghost" id="setServer">修改伺服器名稱</button>
      <button class="ghost" id="clear">清除全部資料</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'aion2-gold-log';
const TOKEN_KEY = 'aion2-gh-token';
const REPO = 'zantensor/aion2-kinah-tracker';
const DATA_FILE = 'data.json';
let state = { unit:'1億基納', server:'梅斯蘭泰達 天8', entries:[] };
let days = 30;

/* Two hosting modes (keep both — see CONTEXT.md):
   - Claude artifact: window.storage exists → private per-user storage, always editable.
   - Static host (GitHub Pages): data.json in the repo is the shared source of truth.
     Everyone reads it; only a browser holding a GitHub token (admin mode) can write,
     by committing data.json through the GitHub contents API. */
const IS_ARTIFACT = !!window.storage;
let token = IS_ARTIFACT ? '' : (localStorage.getItem(TOKEN_KEY) || '');
const canEdit = () => IS_ARTIFACT || !!token;

const $ = id => document.getElementById(id);
const fmt = n => Number.isInteger(n)
  ? n.toLocaleString('en-US')
  : n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:4});
const toast = m => { const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1900); };

function applyMode(){
  document.body.classList.toggle('artifact', IS_ARTIFACT);
  document.body.classList.toggle('ro', !canEdit());
}

/* Hidden admin entry: open the page with #admin to paste a token (owner only).
   #admin again while unlocked logs out. No visible UI for guild members. */
function handleAdminHash(){
  if(IS_ARTIFACT || location.hash !== '#admin') return;
  if(token){
    if(confirm('登出管理模式？')){
      token=''; localStorage.removeItem(TOKEN_KEY);
      applyMode(); render(); toast('已登出管理模式');
    }
  }else{
    const v = prompt('貼上 GitHub fine-grained token（僅需 '+REPO+' 的 Contents 讀寫權限）。\n只會儲存在這個瀏覽器。');
    if(v && v.trim()){
      token=v.trim(); localStorage.setItem(TOKEN_KEY, token);
      applyMode(); render(); toast('管理模式已開啟 — 儲存將同步到 GitHub');
    }
  }
  history.replaceState(null,'',location.pathname+location.search);
}
window.addEventListener('hashchange', handleAdminHash);

async function load(){
  if(IS_ARTIFACT){
    try{
      const r = await window.storage.get(KEY);
      if(r && r.value) state = Object.assign(state, JSON.parse(r.value));
    }catch(e){ /* first run: nothing saved yet */ }
  }else{
    try{
      const res = await fetch(DATA_FILE + '?t=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error();
      state = Object.assign(state, await res.json());
      localStorage.setItem(KEY, JSON.stringify(state)); // offline cache
    }catch(e){
      // data.json unreachable (offline, or file:// preview) — fall back to last cached copy
      try{
        const raw = localStorage.getItem(KEY);
        if(raw) state = Object.assign(state, JSON.parse(raw));
      }catch(_){ }
    }
  }
  applyMode(); render();
}

async function save(){
  if(IS_ARTIFACT){
    try{ await window.storage.set(KEY, JSON.stringify(state)); }
    catch(e){ toast('儲存失敗 — 變更可能遺失'); }
    return;
  }
  state.updated = new Date().toISOString(); // manual admin edits refresh the stamp too
  localStorage.setItem(KEY, JSON.stringify(state));
  if(token) syncToGitHub(); // async on purpose: UI toast first, sync result toast follows
}

async function ghContents(query, opts){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+DATA_FILE+(query||''), Object.assign({
    headers:{
      'Authorization':'Bearer '+token,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json'
    }
  }, opts));
}

async function syncToGitHub(){
  try{
    let sha;
    const g = await ghContents('?ref=main');
    if(g.ok) sha = (await g.json()).sha;
    else if(g.status !== 404) throw new Error('HTTP '+g.status);
    const json = JSON.stringify(state, null, 2);
    const body = {
      message:'Update price data',
      content: btoa(String.fromCharCode(...new TextEncoder().encode(json))),
      branch:'main'
    };
    if(sha) body.sha = sha;
    const put = await ghContents('', {method:'PUT', body: JSON.stringify(body)});
    if(put.status===401 || put.status===403) throw new Error('token 無效');
    if(!put.ok) throw new Error('HTTP '+put.status);
    toast('已同步 ✓ — 約 1 分鐘後全員可見');
  }catch(e){
    toast('同步失敗（'+e.message+'）— 僅存於此瀏覽器');
  }
}

function sorted(){ return [...state.entries].sort((a,b)=>a.date<b.date?-1:1); }
function inRange(){
  const all = sorted();
  if(!days) return all;
  const cut = new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  return all.filter(e=>e.date>=cut);
}

/* Count-up hero price: rolls from 0 on first paint, then between values on
   updates. Skipped for prefers-reduced-motion. */
let shownPrice = null;
function setPrice(target){
  const el = $('price');
  const html = v => '<span class="yuan">¥</span>' + v;
  if(shownPrice === target) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.innerHTML = html(fmt(target)); shownPrice = target; return;
  }
  const from = shownPrice == null ? 0 : shownPrice;
  const t0 = performance.now(), dur = 900;
  const ease = x => 1 - Math.pow(1 - x, 3);
  const mid = v => Number.isInteger(target) ? Math.round(v).toLocaleString('en-US') : v.toFixed(2);
  shownPrice = target;
  requestAnimationFrame(function step(now){
    const k = Math.min(1, (now - t0) / dur);
    el.innerHTML = html(k < 1 ? mid(from + (target - from) * ease(k)) : fmt(target));
    if(k < 1) requestAnimationFrame(step);
  });
}

function render(){
  const all = sorted();
  $('serverName').textContent = state.server;
  $('unitLabel').textContent = '每 ' + state.unit;

  if(all.length){
    const last = all[all.length-1];
    setPrice(last.price);
    const sp = $('spread');
    if(last.low != null && last.high != null){
      sp.hidden = false;
      sp.innerHTML = '掛單區間 <span class="num">¥'+fmt(last.low)+'</span> – <span class="num">¥'+fmt(last.high)+'</span>（前十筆最佳比例）';
    } else sp.hidden = true;
    if(state.updated){
      const u = new Date(state.updated);
      const s = u.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
      const stale = Date.now() - u.getTime() > 8*3600e3; // >8h: a 6h run was missed
      $('asof').innerHTML = '<span class="live-dot'+(stale?' stale':'')+'"></span>最後更新 <time datetime="'+state.updated+'">'+s+'</time>'
        + (stale ? '（更新暫停中）' : '（每 6 小時自動更新）');
    }else{
      const d = new Date(last.date+'T00:00:00');
      $('asof').textContent = '紀錄於 ' + d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});
    }
    const el = $('delta');
    if(all.length>1){
      const prev = all[all.length-2].price;
      const pct = ((last.price-prev)/prev)*100;
      el.className = 'delta ' + (pct>0.001?'up':pct<-0.001?'down':'flat');
      el.textContent = (pct>0?'▲ +':pct<0?'▼ ':'– ') + pct.toFixed(2) + '% 較前次';
    } else { el.className='delta flat'; el.textContent='首筆紀錄'; }
  }

  const win = inRange();
  if(win.length){
    const ps = win.map(e=>e.price);
    $('sAvg').textContent = '¥'+fmt(ps.reduce((a,b)=>a+b,0)/ps.length);
    $('sLow').textContent = '¥'+fmt(Math.min(...ps));
    $('sHigh').textContent= '¥'+fmt(Math.max(...ps));
  } else { $('sAvg').textContent=$('sLow').textContent=$('sHigh').textContent='—'; }
  $('sN').textContent = all.length;

  drawChart(win);
  drawTable(all);
}

function drawChart(data){
  const host = $('chartHost');
  if(data.length < 2){
    host.innerHTML = '<div class="empty">'+(data.length?'目前只有一筆紀錄 — 累積幾天後即可看到走勢。':'此區間內尚無紀錄。')+'</div>';
    return;
  }
  const W=760, H=200, PT=18, PB=26, PR=54, PL=6;
  const xs = data.map(e=>new Date(e.date+'T00:00:00').getTime());
  const ys = data.map(e=>e.price);
  const hasBand = data.every(e=>e.low!=null && e.high!=null);
  const allVals = hasBand ? ys.concat(data.map(e=>e.low), data.map(e=>e.high)) : ys;
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let lo=Math.min(...allVals), hi=Math.max(...allVals);
  if(hi===lo){ hi+=hi*0.02||1; lo-=lo*0.02||1; }
  const pad=(hi-lo)*0.18; lo-=pad; hi+=pad;
  const px = t => PL + ((t-x0)/(x1-x0||1))*(W-PL-PR);
  const py = v => PT + (1-(v-lo)/(hi-lo))*(H-PT-PB);

  const pts = data.map((e,i)=>[px(xs[i]), py(ys[i])]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L ${pts[pts.length-1][0].toFixed(1)} ${H-PB} L ${pts[0][0].toFixed(1)} ${H-PB} Z`;
  const lastP = pts[pts.length-1];

  // daily listing-spread band (low..high around the median line)
  let band = '';
  if(hasBand){
    const t = data.map((e,i)=>px(xs[i]).toFixed(1)+' '+py(e.high).toFixed(1));
    const b = data.map((e,i)=>px(xs[i]).toFixed(1)+' '+py(e.low).toFixed(1)).reverse();
    band = `<path d="M${t.join(' L ')} L ${b.join(' L ')} Z" fill="#3D5BD9" opacity=".09"/>`;
  }

  const gy = [hi-pad, lo+pad].map(v=>
    `<line x1="${PL}" y1="${py(v).toFixed(1)}" x2="${W-PR}" y2="${py(v).toFixed(1)}" stroke="#C9D0E8" stroke-dasharray="2 5"/>
     <text x="${W-PR+9}" y="${(py(v)+4).toFixed(1)}" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5B628C">¥${fmt(v)}</text>`).join('');

  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#3D5BD9" opacity="${i===pts.length-1?0:.35}"/>`).join('');

  const fd = t => new Date(t).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'});

  host.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="基納價格走勢圖">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D5BD9" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#3D5BD9" stop-opacity="0"/>
    </linearGradient></defs>
    ${gy}
    ${band}
    <path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="#3D5BD9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${dots}
    <circle cx="${lastP[0].toFixed(1)}" cy="${lastP[1].toFixed(1)}" r="8" fill="#3D5BD9" opacity=".16"/>
    <circle cx="${lastP[0].toFixed(1)}" cy="${lastP[1].toFixed(1)}" r="4" fill="#3D5BD9" stroke="#FAFBFF" stroke-width="2"/>
    <text x="${PL}" y="${H-6}" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5B628C">${fd(x0)}</text>
    <text x="${W-PR}" y="${H-6}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5B628C">${fd(x1)}</text>
  </svg>`;
}

function drawTable(all){
  const host = $('tableHost');
  if(!all.length){ host.innerHTML='<div class="empty">尚無紀錄。</div>'; return; }
  const rows = [...all].reverse().map((e,i,arr)=>{
    const prev = arr[i+1];
    let ch='—', cls='';
    if(prev){
      const p=((e.price-prev.price)/prev.price)*100;
      ch=(p>0?'+':'')+p.toFixed(2)+'%';
      cls = p>0.001?'style="color:#B03A57"':p<-0.001?'style="color:#22755F"':'';
    }
    const d=new Date(e.date+'T00:00:00').toLocaleDateString('zh-TW',{year:'2-digit',month:'numeric',day:'numeric'});
    return `<tr><td>${d}</td><td>¥${fmt(e.price)}</td><td ${cls}>${ch}</td>
      <td style="width:34px"><button class="del" data-d="${e.date}" aria-label="刪除 ${d}">×</button></td></tr>`;
  }).join('');
  host.innerHTML = `<table><thead><tr><th>日期</th><th>價格</th><th>漲跌</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  host.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    state.entries = state.entries.filter(e=>e.date!==b.dataset.d);
    await save(); render(); toast('已刪除');
  });
}

$('form').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const date=$('date').value, price=parseFloat($('val').value);
  if(!date || !(price>0)){ toast('請輸入日期與大於零的價格'); return; }
  const existing = state.entries.find(e=>e.date===date);
  if(existing) existing.price=price; else state.entries.push({date,price});
  await save(); render();
  $('val').value='';
  toast(existing?'已更新價格':'已儲存價格');
});

$('range').addEventListener('click', ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  days=+b.dataset.d;
  [...ev.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed', c===b));
  render();
});

$('setUnit').onclick = async()=>{
  const v=prompt('這個價格對應多少數量？', state.unit);
  if(v && v.trim()){ state.unit=v.trim(); await save(); render(); }
};
$('setServer').onclick = async()=>{
  const v=prompt('伺服器名稱', state.server);
  if(v && v.trim()){ state.server=v.trim(); await save(); render(); }
};
$('clear').onclick = async()=>{
  if(!confirm('確定刪除所有價格紀錄？此操作無法復原。')) return;
  state.entries=[]; await save(); render(); toast('已清除全部資料');
};

$('date').value = new Date().toISOString().slice(0,10);
applyMode(); // hide editing UI immediately; load() re-applies after data arrives
load().then(handleAdminHash);
</script>
</body>
</html>
